name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main # Triggers deployment when you push to the main branch

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🛠️ Build Static Export
        run: npm run build
        env:
          # Ensure Next.js API calls point to your production backend URL
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

      - name: 🚀 Deploy to Hostinger (public_html)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          source: "out/*"
          target: "public_html/"
          strip_components: 1

      - name: 🚀 Deploy to Hostinger (domains/spotengineer.in/public_html)
        uses: appleboy/scp-action@v0.1.7
        continue-on-error: true
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 65002 }}
          source: "out/*"
          target: "domains/spotengineer.in/public_html/"
          strip_components: 1
